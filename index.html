<!DOCTYPE HTML>
<html lang="en">

<head>

    <title>Mediated Worlds</title>

    <meta charset="utf-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1, user-scalable=no"
    >

    <link
        rel="stylesheet"
        href="assets/css/main.css"
    >

    <noscript>
        <link
            rel="stylesheet"
            href="assets/css/noscript.css"
        >
    </noscript>


    <!-- =====================================================
         THREE.JS IMPORT MAP
    ====================================================== -->

    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.180.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.180.0/examples/jsm/"
        }
    }
    </script>


    <!-- =====================================================
         PAGE / MAP CSS
    ====================================================== -->

    <style>

        html,
        body {

            margin: 0;
            padding: 0;

            width: 100%;
            height: 100%;

            overflow: hidden;

        }


        body {

            background: transparent;

        }


        #wrapper {

            position: relative;

            width: 100%;
            height: 100vh;

            overflow: hidden;

        }


        /* =================================================
           INTRO
        ================================================= */

        #intro {

            position: fixed;

            inset: 0;

            width: 100vw;
            height: 100vh;

            z-index: 100;

            display: flex;

            flex-direction: column;

            justify-content: center;

            align-items: center;

            box-sizing: border-box;

            background: transparent;

            transition:
                opacity 900ms ease,
                visibility 900ms ease;

        }


        #intro.map-active {

            opacity: 0;

            visibility: hidden;

            pointer-events: none;

        }


        #intro h1 {

            margin: 0;

        }


        #intro h4 {

            text-align: center;

        }


        /* =================================================
           THREE MAP
        ================================================= */

        #three-container {

            position: fixed;

            inset: 0;

            width: 100vw;
            height: 100vh;

            margin: 0;
            padding: 0;

            overflow: hidden;

            background: #000;

            z-index: 1;

            opacity: 0;

            pointer-events: none;

            transition:
                opacity 900ms ease;

        }


        #three-container.visible {

            opacity: 1;

            pointer-events: auto;

        }


        #three-canvas {

            position: absolute;

            inset: 0;

            display: block;

            width: 100%;
            height: 100%;

        }


        /* =================================================
           TOP NAVIGATION
        ================================================= */

        #site-top-bar {

            position: fixed;

            top: 0;
            left: 0;

            width: 100%;

            height: 62px;

            box-sizing: border-box;

            z-index: 200;

            display: flex;

            align-items: center;

            justify-content: space-between;

            padding: 0 28px;

            background:
                rgba(0, 0, 0, .18);

            border-bottom:
                1px solid
                rgba(255, 255, 255, .16);

            backdrop-filter:
                blur(7px);

            -webkit-backdrop-filter:
                blur(7px);

            opacity: 0;

            transform:
                translateY(-10px);

            pointer-events: none;

            transition:
                opacity 500ms ease,
                transform 500ms ease;

        }


        #site-top-bar.visible {

            opacity: 1;

            transform:
                translateY(0);

            pointer-events: auto;

        }


        #site-top-bar .site-name {

            color: #fff;

            text-decoration: none;

            font-size: 14px;

            letter-spacing: .08em;

            text-transform: uppercase;

        }


        #site-top-bar .site-links {

            display: flex;

            align-items: center;

            gap: 28px;

        }


        #site-top-bar .site-links a {

            color:
                rgba(255, 255, 255, .82);

            text-decoration: none;

            font-size: 11px;

            letter-spacing: .12em;

            text-transform: uppercase;

            transition:
                color 200ms ease;

        }


        #site-top-bar .site-links a:hover {

            color: #fff;

        }


        #site-top-bar .socials {

            display: flex;

            align-items: center;

            gap: 14px;

            margin-left: 28px;

        }


        #site-top-bar .socials a {

            color:
                rgba(255, 255, 255, .72);

            font-size: 13px;

            text-decoration: none;

        }


        #site-top-bar .socials a:hover {

            color: #fff;

        }


        /* =================================================
           BOTTOM BAR
        ================================================= */

        #site-bottom-bar {

            position: fixed;

            left: 0;
            bottom: 0;

            width: 100%;

            height: 54px;

            box-sizing: border-box;

            z-index: 200;

            display: flex;

            align-items: center;

            justify-content: space-between;

            padding: 0 28px;

            background:
                rgba(0, 0, 0, .18);

            border-top:
                1px solid
                rgba(255, 255, 255, .16);

            backdrop-filter:
                blur(7px);

            -webkit-backdrop-filter:
                blur(7px);

            opacity: 0;

            transform:
                translateY(10px);

            pointer-events: none;

            transition:
                opacity 500ms ease,
                transform 500ms ease;

        }


        #site-bottom-bar.visible {

            opacity: 1;

            transform:
                translateY(0);

            pointer-events: auto;

        }


        #site-bottom-bar span {

            color:
                rgba(255, 255, 255, .55);

            font-size: 10px;

            letter-spacing: .08em;

        }


        #site-bottom-bar a {

            color:
                rgba(255, 255, 255, .65);

            text-decoration: none;

            font-size: 10px;

        }


        /* =================================================
           PROJECT LABELS
        ================================================= */

        .project-label {

            position: fixed;

            z-index: 150;

            pointer-events: none;

            width: 230px;

            color:
                rgba(255, 255, 255, .92);

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            font-size: 15px;

            line-height: 1.35;

            letter-spacing: .01em;

            text-shadow:
                0 2px 8px
                rgba(0, 0, 0, .95);

            transform:
                translate3d(0, -50%, 0);

            transition:
                opacity 180ms ease;

            white-space: normal;

        }


        /* =================================================
           PROJECT PANEL
        ================================================= */

        #project-hover-panel {

            position: fixed;

            left: 0;
            top: 0;

            width: 320px;

            box-sizing: border-box;

            padding: 10px;

            background:
                rgba(0, 0, 0, .94);

            border:
                1px solid
                rgba(255, 255, 255, .22);

            color: white;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            opacity: 0;

            visibility: hidden;

            pointer-events: none;

            transform:
                translate3d(12px, 0, 0);

            transition:
                opacity 160ms ease,
                transform 160ms ease;

            z-index: 99999;

            box-shadow:
                0 12px 40px
                rgba(0, 0, 0, .55);

        }


        #project-hover-panel.visible {

            opacity: 1;

            visibility: visible;

            transform:
                translate3d(0, 0, 0);

        }


        #project-panel-image-wrap {

            width: 100%;

            height: 165px;

            overflow: hidden;

            background: #080808;

            margin-bottom: 12px;

        }


        #project-panel-image {

            display: block;

            width: 100%;
            height: 100%;

            object-fit: cover;

        }


        #project-panel-title {

            font-size: 15px;

            line-height: 1.3;

            font-weight: 500;

            margin-bottom: 9px;

        }


        #project-panel-description {

            font-size: 12px;

            line-height: 1.5;

            color:
                rgba(255, 255, 255, .68);

        }


        #project-panel-hint {

            margin-top: 14px;

            padding-top: 9px;

            border-top:
                1px solid
                rgba(255, 255, 255, .12);

            font-size: 9px;

            letter-spacing: .12em;

            color:
                rgba(255, 255, 255, .4);

        }


        /* =================================================
           SCROLL INDICATOR
        ================================================= */

        #scroll-indicator {

            position: fixed;

            left: 50%;

            bottom: 30px;

            transform:
                translateX(-50%);

            z-index: 110;

            color:
                rgba(255, 255, 255, .55);

            font-size: 9px;

            letter-spacing: .18em;

            text-transform: uppercase;

            transition:
                opacity 400ms ease;

        }


        #scroll-indicator.hidden {

            opacity: 0;

        }


        /* =================================================
           MOBILE
        ================================================= */

        @media (max-width: 700px) {

            #site-top-bar {

                padding: 0 16px;

            }


            #site-top-bar .site-name {

                display: none;

            }


            #site-top-bar .site-links {

                gap: 16px;

            }


            #site-top-bar .socials {

                margin-left: 12px;

                gap: 9px;

            }


            #site-bottom-bar {

                padding: 0 16px;

            }


            .project-label {

                width: 170px;

                font-size: 10px;

            }

        }

    </style>

</head>


<body class="is-preload">

<!-- =====================================================
     ORIGINAL MASSIVELY SCRIPTS
====================================================== -->

<script src="assets/js/jquery.min.js"></script>
<script src="assets/js/jquery.scrollex.min.js"></script>
<script src="assets/js/jquery.scrolly.min.js"></script>
<script src="assets/js/browser.min.js"></script>
<script src="assets/js/breakpoints.min.js"></script>
<script src="assets/js/util.js"></script>
<script src="assets/js/main.js"></script>


<!-- =====================================================
     THREE MAP
====================================================== -->

<script
    type="module"
    src="./three-map.js"
></script>


<!-- =====================================================
     SCROLL STORY
====================================================== -->

<script>

(function () {

    const intro =
        document.getElementById('intro');

    const map =
        document.getElementById('three-container');

    const topBar =
        document.getElementById('site-top-bar');

    const bottomBar =
        document.getElementById('site-bottom-bar');

    const indicator =
        document.getElementById('scroll-indicator');

    const continueButton =
        document.getElementById('continue-button');

    const archiveLink =
        document.getElementById('archive-link');

    const topLogo =
        document.getElementById('top-logo');


    let progress = 0;

    let targetProgress = 0;

    let animating = false;


    function enterMap() {

        targetProgress = 1;

        startAnimation();

    }


    function returnToIntro() {

        targetProgress = 0;

        startAnimation();

    }


    function startAnimation() {

        if (animating)
            return;

        animating = true;

        requestAnimationFrame(
            animateTransition
        );

    }


    function animateTransition() {

        const difference =
            targetProgress -
            progress;


        progress +=
            difference * 0.085;


        if (
            Math.abs(difference) <
            0.001
        ) {

            progress =
                targetProgress;

        }


        updateInterface();


        if (
            progress !== targetProgress
        ) {

            requestAnimationFrame(
                animateTransition
            );

        } else {

            animating = false;

        }

    }


    function updateInterface() {

        const active =
            progress > 0.35;


        if (active) {

            intro.classList.add(
                'map-active'
            );

            map.classList.add(
                'visible'
            );

            topBar.classList.add(
                'visible'
            );

            bottomBar.classList.add(
                'visible'
            );

            indicator.classList.add(
                'hidden'
            );

        } else {

            intro.classList.remove(
                'map-active'
            );

            map.classList.remove(
                'visible'
            );

            topBar.classList.remove(
                'visible'
            );

            bottomBar.classList.remove(
                'visible'
            );

            indicator.classList.remove(
                'hidden'
            );

        }


        window.mapStoryProgress =
            progress;

    }


    window.addEventListener(

        'wheel',

        function (event) {

            event.preventDefault();


            if (
                event.deltaY > 0
            ) {

                targetProgress =
                    Math.min(
                        1,
                        targetProgress + 0.22
                    );

            }

            else if (
                event.deltaY < 0
            ) {

                targetProgress =
                    Math.max(
                        0,
                        targetProgress - 0.22
                    );

            }


            startAnimation();

        },

        {
            passive: false
        }

    );


    continueButton.addEventListener(

        'click',

        function (event) {

            event.preventDefault();

            enterMap();

        }

    );


    archiveLink.addEventListener(

        'click',

        function (event) {

            event.preventDefault();

            returnToIntro();

        }

    );


    topLogo.addEventListener(

        'click',

        function (event) {

            event.preventDefault();

            returnToIntro();

        }

    );


    window.addEventListener(

        'keydown',

        function (event) {

            if (

                event.key === 'ArrowDown' ||
                event.key === 'PageDown' ||
                event.key === ' '

            ) {

                event.preventDefault();

                enterMap();

            }


            if (

                event.key === 'ArrowUp' ||
                event.key === 'PageUp'

            ) {

                event.preventDefault();

                returnToIntro();

            }

        }

    );


    updateInterface();

})();

</script>
